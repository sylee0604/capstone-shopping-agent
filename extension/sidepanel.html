<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>쇼핑 에이전트 v2</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>쇼핑 에이전트 <span class="badge">v2 개발용</span></h1>
    <p>LangGraph 흐름 확인용 · 노드는 가짜 함수예요</p>
  </header>
  <section class="form">
    <label>요청<textarea id="query" rows="2">여아 봄 원피스 110 사이즈, 3만원 이하</textarea></label>
    <label>시나리오<select id="scenario"></select></label>
    <button id="start" class="primary">시작</button>
    <button id="resume" class="secondary" hidden></button>
  </section>
  <ol id="progress"></ol>
  <section id="pause" class="pause-box" hidden></section>
  <section id="error" class="error" hidden></section>
  <section id="result" class="result" hidden></section>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
